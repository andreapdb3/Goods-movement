ptions=\"{{ fr.options }}\" sc-camel-spec-badge=\"{{ fr.specBadge }}\" info=\"{{ fr.info }}\" sc-camel-info-photos=\"{{ fr.infoPhotos }}\" sc-camel-info-video=\"{{ fr.infoVideo }}\" sc-camel-info-blocks=\"{{ fr.infoBlocks }}\" sc-camel-read-only=\"{{ fr.readOnly }}\" sc-camel-on-change=\"{{ fr.onChange }}\" hint-size=\"100%,60\"><\u002Fdc-import>\n                  <\u002Fsc-for>\n                  <sc-for list=\"{{ sku.subSections }}\" as=\"sub\" hint-placeholder-count=\"4\">\n                    <div style=\"padding:9px 16px;background:#fbfaf6;font-weight:700;font-size:12.5px;color:#7c3aed;border-top:1px solid #f0ece3;\">{{ sub.title }}<\u002Fdiv>\n                    <sc-for list=\"{{ sub.fields }}\" as=\"fr\" hint-placeholder-count=\"3\">\n                      <dc-import name=\"GMFieldRow\" field-name=\"{{ fr.name }}\" sc-camel-type-kind=\"{{ fr.typeKind }}\" mandatory=\"{{ fr.mandatory }}\" value=\"{{ fr.value }}\" options=\"{{ fr.options }}\" sc-camel-spec-badge=\"{{ fr.specBadge }}\" info=\"{{ fr.info }}\" sc-camel-info-photos=\"{{ fr.infoPhotos }}\" sc-camel-info-video=\"{{ fr.infoVideo }}\" sc-camel-info-blocks=\"{{ fr.infoBlocks }}\" sc-camel-read-only=\"{{ fr.readOnly }}\" sc-camel-on-change=\"{{ fr.onChange }}\" hint-size=\"100%,60\"><\u002Fdc-import>\n                    <\u002Fsc-for>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"padding:12px 16px;\">\n                <button sc-camel-on-click=\"{{ po.onAddSku }}\" style=\"padding:8px 14px;border-radius:9px;border:1.4px dashed #c4b5fd;background:#fbf9ff;color:#6d28d9;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;\">+ Add SKU<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <button sc-camel-on-click=\"{{ onAddPo }}\" style=\"padding:10px 16px;border-radius:9px;border:1.4px dashed #c4b5fd;background:#fbf9ff;color:#6d28d9;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;margin-bottom:18px;\">+ Add PO<\u002Fbutton>\n        <\u002Fsc-if>\n\n        <!-- shipping / transfer: flat item repeat -->\n        <sc-if value=\"{{ isFlatKind }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"font-weight:700;font-size:15px;color:#20243f;margin-bottom:10px;\">{{ itemSectionTitle }}<\u002Fdiv>\n          <sc-for list=\"{{ itemsRender }}\" as=\"it\" hint-placeholder-count=\"1\">\n            <div style=\"background:#fff;border-radius:14px;border:1px solid #ece7dd;overflow:hidden;margin-bottom:14px;\">\n              <div style=\"padding:10px 18px;background:#faf8f4;border-bottom:1px solid #ece7dd;display:flex;align-items:center;justify-content:space-between;\">\n                <span style=\"font-weight:700;font-size:13.5px;color:#20243f;\">Item {{ it.index }}<\u002Fspan>\n                <sc-if value=\"{{ it.canRemove }}\" hint-placeholder-val=\"{{ false }}\"><span sc-camel-on-click=\"{{ it.onRemove }}\" style=\"font-size:12px;color:#c0392b;font-weight:600;cursor:pointer;\">Remove item<\u002Fspan><\u002Fsc-if>\n              <\u002Fdiv>\n              <sc-for list=\"{{ it.fieldsRender }}\" as=\"fr\" hint-placeholder-count=\"3\">\n                <dc-import name=\"GMFieldRow\" field-name=\"{{ fr.name }}\" sc-camel-type-kind=\"{{ fr.typeKind }}\" mandatory=\"{{ fr.mandatory }}\" value=\"{{ fr.value }}\" options=\"{{ fr.options }}\" sc-camel-spec-badge=\"{{ fr.specBadge }}\" info=\"{{ fr.info }}\" sc-camel-info-photos=\"{{ fr.infoPhotos }}\" sc-camel-info-video=\"{{ fr.infoVideo }}\" sc-camel-info-blocks=\"{{ fr.infoBlocks }}\" sc-camel-read-only=\"{{ fr.readOnly }}\" sc-camel-on-change=\"{{ fr.onChange }}\" hint-size=\"100%,60\"><\u002Fdc-import>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <button sc-camel-on-click=\"{{ onAddItem }}\" style=\"padding:10px 16px;border-radius:9px;border:1.4px dashed #c4b5fd;background:#fbf9ff;color:#6d28d9;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;margin-bottom:18px;\">+ Add item<\u002Fbutton>\n        <\u002Fsc-if>\n\n        <div style=\"background:#fff;border-radius:14px;border:1px solid #ece7dd;overflow:hidden;margin-bottom:100px;\">\n          <div style=\"padding:12px 18px;background:#faf8f4;border-bottom:1px solid #ece7dd;font-weight:700;font-size:14px;color:#20243f;\">QA / QC Authorization<\u002Fdiv>\n          <sc-for list=\"{{ qaFieldsRender }}\" as=\"fr\" hint-placeholder-count=\"3\">\n            <dc-import name=\"GMFieldRow\" field-name=\"{{ fr.name }}\" sc-camel-type-kind=\"{{ fr.typeKind }}\" mandatory=\"{{ fr.mandatory }}\" value=\"{{ fr.value }}\" options=\"{{ fr.options }}\" sc-camel-spec-badge=\"{{ fr.specBadge }}\" info=\"{{ fr.info }}\" sc-camel-info-photos=\"{{ fr.infoPhotos }}\" sc-camel-info-video=\"{{ fr.infoVideo }}\" sc-camel-info-blocks=\"{{ fr.infoBlocks }}\" sc-camel-read-only=\"{{ fr.readOnly }}\" sc-camel-on-change=\"{{ fr.onChange }}\" hint-size=\"100%,60\"><\u002Fdc-import>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n       <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ REPORTS ============ -->\n      <sc-if value=\"{{ viewReports }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-bottom:22px;\">\n          <div style=\"font-size:26px;font-weight:700;color:#20243f;\">Reports<\u002Fdiv>\n          <div style=\"font-size:14px;color:#8b8f9e;margin-top:4px;max-width:660px;\">Report layouts are saved on the template — one per customer, each with its own set of fields. Then pick any inspection and choose which layout to send.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:16px;\">\n          <sc-for list=\"{{ reportGroups }}\" as=\"rgp\" hint-placeholder-count=\"2\">\n            <div style=\"background:#fff;border-radius:16px;border:1px solid #ece7dd;overflow:hidden;\">\n              <div style=\"padding:14px 20px;background:#faf8f4;border-bottom:1px solid #ece7dd;display:flex;align-items:center;gap:10px;flex-wrap:wrap;\">\n                <span style=\"font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:20px;background:{{ rgp.typeBg }};color:{{ rgp.typeColor }};\">{{ rgp.movementType }}<\u002Fspan>\n                <span style=\"font-weight:700;font-size:15px;color:#20243f;\">{{ rgp.name }}<\u002Fspan>\n                <span style=\"font-size:12.5px;color:#9aa0ae;\">{{ rgp.countLabel }}<\u002Fspan>\n                <span style=\"flex:1;\"><\u002Fspan>\n                <span style=\"font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;background:{{ rgp.layoutBg }};color:{{ rgp.layoutColor }};\">{{ rgp.layoutCountLabel }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:9px;padding:13px 20px;border-bottom:1px solid #f4f0e8;align-items:center;\">\n                <span style=\"font-size:11.5px;font-weight:700;color:#9aa0ae;\">REPORTS:<\u002Fspan>\n                <sc-for list=\"{{ rgp.layoutChips }}\" as=\"lc\" hint-placeholder-count=\"3\">\n                  <div sc-camel-on-click=\"{{ lc.onOpen }}\" style=\"display:flex;align-items:center;gap:9px;padding:7px 12px;border-radius:11px;border:1.4px solid #ddd0fb;background:#f8f5ff;cursor:pointer;\">\n                    <span style=\"font-size:13px;font-weight:700;color:#6d28d9;\">{{ lc.name }}<\u002Fspan>\n                    <span style=\"font-size:11px;color:#9b8ec4;\">{{ lc.fieldsLabel }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <span sc-camel-on-click=\"{{ rgp.onNewLayout }}\" style=\"cursor:pointer;padding:8px 13px;border-radius:11px;border:1.4px dashed #ddd0fb;color:#7c3aed;font-size:12px;font-weight:700;\">+ New report layout<\u002Fspan>\n              <\u002Fdiv>\n              <sc-for list=\"{{ rgp.records }}\" as=\"rr\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;align-items:center;gap:14px;padding:13px 20px;border-bottom:1px solid #f4f0e8;flex-wrap:wrap;\">\n                  <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:600;color:#20243f;min-width:96px;\">{{ rr.id }}<\u002Fspan>\n                  <span style=\"font-size:13px;color:#5b6172;min-width:120px;\">{{ rr.operator }}<\u002Fspan>\n                  <span style=\"font-size:12.5px;color:#9aa0ae;min-width:150px;\">{{ rr.timestampLabel }}<\u002Fspan>\n                  <span style=\"font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:{{ rr.statusBg }};color:{{ rr.statusColor }};\">{{ rr.workflowStatus }}<\u002Fspan>\n                  <span style=\"font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:{{ rr.dispBg }};color:{{ rr.dispColor }};\">{{ rr.dispositionLabel }}<\u002Fspan>\n                  <span style=\"flex:1;\"><\u002Fspan>\n                  <sc-if value=\"{{ rr.hasLayouts }}\" hint-placeholder-val=\"{{ true }}\">\n                    <sc-raw-select value=\"{{ rr.layoutValue }}\" sc-camel-on-change=\"{{ rr.onPickLayout }}\" style=\"height:36px;box-sizing:border-box;padding:0 10px;border-radius:9px;border:1.4px solid #e3ddd1;font-size:12.5px;font-family:inherit;background:#fff;color:#3a3f57;min-width:150px;\">\n                      <sc-for list=\"{{ rr.layoutOptions }}\" as=\"lo\" hint-placeholder-count=\"3\"><option value=\"{{ lo.id }}\">{{ lo.name }}<\u002Foption><\u002Fsc-for>\n                    <\u002Fsc-raw-select>\n                  <\u002Fsc-if>\n                  <button sc-camel-on-click=\"{{ rr.onBuild }}\" style=\"padding:8px 15px;border-radius:9px;border:1.4px solid #ddd0fb;background:#f6f1ff;color:#6d28d9;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;\">{{ rr.actionLabel }}<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ REPORT FIELD PICKER ============ -->\n      <sc-if value=\"{{ viewReportFields }}\" hint-placeholder-val=\"{{ false }}\">\n        <a href=\"#\" sc-camel-on-click=\"{{ goReports }}\" style=\"font-size:13.5px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px;margin-bottom:16px;\">← Back to Reports<\u002Fa>\n        <div style=\"background:#fff;border-radius:16px;border:1px solid #ece7dd;padding:20px 24px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;\">\n          <div style=\"flex:1;min-width:260px;\">\n            <input type=\"text\" value=\"{{ rfLayoutName }}\" sc-camel-on-change=\"{{ onLayoutName }}\" sc-camel-read-only=\"{{ rfReadOnly }}\" placeholder=\"Who is this report for? e.g. HEB, Walmart, Whole Foods\" style=\"font-size:20px;font-weight:700;color:#20243f;font-family:inherit;border:1.5px solid {{ rfNameBorder }};border-radius:9px;background:{{ rfNameBg }};padding:2px 8px;margin-left:-8px;width:100%;max-width:520px;box-sizing:border-box;\" style-focus=\"border-color:#c4b5fd;background:#fff;\">\n            <div style=\"font-size:13px;color:#8b8f9e;margin-top:3px;\">{{ rfTemplateName }} · {{ rfSelectedLabel }}. Saved on the template — reusable for every inspection captured with it.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:flex-end;gap:8px;\">\n          <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end;\">\n            <span style=\"flex:none;white-space:nowrap;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;background:{{ rfSavedBg }};color:{{ rfSavedColor }};\">{{ rfSavedState }}<\u002Fspan>\n            <sc-if value=\"{{ rfEditing }}\" hint-placeholder-val=\"{{ false }}\">\n              <span sc-camel-on-click=\"{{ onCancelEditLayout }}\" style=\"flex:none;white-space:nowrap;font-size:12.5px;font-weight:700;color:#5b6172;cursor:pointer;padding:9px 14px;border-radius:10px;border:1.4px solid #e3ddd1;background:#fff;\">Cancel<\u002Fspan>\n              <button sc-camel-on-click=\"{{ onSaveLayout }}\" style=\"flex:none;white-space:nowrap;padding:10px 18px;border-radius:10px;border:none;background:#7c3aed;color:#fff;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;box-shadow:0 6px 16px rgba(124,58,237,.28);\">Save<\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ rfReadOnly }}\" hint-placeholder-val=\"{{ true }}\">\n              <span sc-camel-on-click=\"{{ onDuplicateLayout }}\" style=\"flex:none;white-space:nowrap;font-size:12.5px;font-weight:700;color:#5b6172;cursor:pointer;padding:9px 14px;border-radius:10px;border:1.4px solid #e3ddd1;background:#fff;\">Duplicate<\u002Fspan>\n              <button sc-camel-on-click=\"{{ onStartEditLayout }}\" style=\"flex:none;white-space:nowrap;padding:10px 18px;border-radius:10px;border:1.4px solid #ddd0fb;background:#f6f1ff;color:#6d28d9;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;\">Edit<\u002Fbutton>\n            <\u002Fsc-if>\n            <button sc-camel-on-click=\"{{ onReportFieldsContinue }}\" style=\"flex:none;white-space:nowrap;padding:10px 20px;border-radius:10px;border:1.4px solid #e3ddd1;background:#fff;color:#3a3f57;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;\">Preview<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ rfEditing }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:flex-end;padding-right:2px;\">\n              <span sc-camel-on-click=\"{{ onReportSelectAll }}\" style=\"white-space:nowrap;font-size:12.5px;font-weight:700;color:#7c3aed;cursor:pointer;\">Select all<\u002Fspan>\n              <span sc-camel-on-click=\"{{ onReportSelectNone }}\" style=\"white-space:nowrap;font-size:12.5px;font-weight:700;color:#9aa0ae;cursor:pointer;\">Clear<\u002Fspan>\n              <span sc-camel-on-click=\"{{ onDeleteLayout }}\" style=\"white-space:nowrap;font-size:12.5px;font-weight:700;color:#c0392b;cursor:pointer;\">Delete<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ dlOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:fixed;inset:0;background:rgba(24,20,16,.45);display:flex;align-items:center;justify-content:center;z-index:80;padding:20px;\">\n            <div style=\"background:#fff;border-radius:16px;border:1px solid #ece7dd;box-shadow:0 24px 60px rgba(0,0,0,.22);width:100%;max-width:440px;padding:24px;\">\n              <div style=\"font-size:18px;font-weight:700;color:#20243f;\">Delete this report layout?<\u002Fdiv>\n              <div style=\"font-size:13.5px;color:#5b6172;margin-top:8px;line-height:1.5;\">“{{ dlName }}” will be removed from this template for everyone. This can’t be undone.<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#8b8f9e;margin-top:16px;\">Type <strong style=\"color:#c0392b;\">delete<\u002Fstrong> to confirm.<\u002Fdiv>\n              <input type=\"text\" value=\"{{ dlText }}\" sc-camel-on-change=\"{{ onDeleteLayoutText }}\" placeholder=\"delete\" style=\"margin-top:8px;width:100%;box-sizing:border-box;height:40px;padding:0 12px;border-radius:10px;border:1.4px solid #e3ddd1;font-size:13.5px;font-family:inherit;color:#20243f;background:#fff;\" style-focus=\"border-color:#c0392b;\">\n              <div style=\"display:flex;gap:10px;justify-content:flex-end;margin-top:20px;\">\n                <span sc-camel-on-click=\"{{ onCancelDeleteLayout }}\" style=\"padding:10px 16px;border-radius:10px;border:1.4px solid #e3ddd1;background:#fff;color:#5b6172;font-size:13px;font-weight:700;cursor:pointer;\">Cancel<\u002Fspan>\n                <button sc-camel-on-click=\"{{ onConfirmDeleteLayout }}\" style=\"padding:10px 18px;border-radius:10px;border:none;background:{{ dlBtnBg }};color:{{ dlBtnColor }};font-size:13px;font-weight:700;cursor:{{ dlBtnCursor }};font-family:inherit;\">Delete layout<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-for list=\"{{ rfSections }}\" as=\"rs\" hint-placeholder-count=\"3\">\n          <div style=\"background:#fff;border-radius:14px;border:1px solid #ece7dd;overflow:hidden;margin-bottom:14px;\">\n            <div style=\"padding:12px 18px;background:#faf8f4;border-bottom:1px solid #ece7dd;display:flex;align-items:center;gap:10px;\">\n              <span style=\"font-weight:700;font-size:14px;color:#20243f;flex:1;\">{{ rs.title }}<\u002Fspan>\n              <sc-if value=\"{{ rs.editing }}\" hint-placeholder-val=\"{{ false }}\"><span sc-camel-on-click=\"{{ rs.onToggleAll }}\" style=\"font-size:11.5px;font-weight:700;color:#7c3aed;cursor:pointer;\">{{ rs.toggleLabel }}<\u002Fspan><\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:2px;padding:8px;\">\n              <sc-for list=\"{{ rs.fields }}\" as=\"rf\" hint-placeholder-count=\"4\">\n                <div sc-camel-on-click=\"{{ rf.onToggle }}\" style=\"display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;cursor:{{ rf.rowCursor }};opacity:{{ rf.rowOpacity }};background:{{ rf.rowBg }};\">\n                  <span style=\"width:17px;height:17px;border-radius:5px;border:1.6px solid {{ rf.checkBorder }};background:{{ rf.checkBg }};color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;flex:none;\">{{ rf.checkMark }}<\u002Fspan>\n                  <span style=\"flex:1;font-size:13px;color:#3a3f57;\">{{ rf.name }}<\u002Fspan>\n                  <span style=\"font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:20px;background:{{ rf.typeBg }};color:{{ rf.typeColor }};\">{{ rf.type }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fsc-if>\n\n      <!-- ============ REPORT PREVIEW ============ -->\n      <sc-if value=\"{{ viewReportPreview }}\" hint-placeholder-val=\"{{ false }}\">\n        <a href=\"#\" sc-camel-on-click=\"{{ goReports }}\" style=\"font-size:13.5px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px;margin-bottom:16px;\">← Back to Reports<\u002Fa>\n        <div style=\"background:#fff;border-radius:16px;border:1px solid #ece7dd;padding:16px 22px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;\">\n          <div>\n            <div style=\"font-size:18px;font-weight:700;color:#20243f;\">Report preview<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#8b8f9e;margin-top:2px;\">{{ rpSubtitle }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:9px;align-items:center;flex-wrap:wrap;\">\n            <span sc-camel-on-click=\"{{ onReportEditFields }}\" style=\"font-size:12.5px;font-weight:700;color:#7c3aed;cursor:pointer;\">Edit fields<\u002Fspan>\n            <button sc-camel-on-click=\"{{ onReportSave }}\" style=\"padding:9px 16px;border-radius:9px;border:1.4px solid #e3ddd1;background:#fff;color:#5b6172;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;\">{{ rpSaveLabel }}<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ onReportPrint }}\" style=\"padding:9px 18px;border-radius:9px;border:none;background:#7c3aed;color:#fff;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;box-shadow:0 6px 16px rgba(124,58,237,.28);\">Download PDF<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border-radius:14px;border:1px solid #ece7dd;padding:14px 18px;margin-bottom:18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;\">\n          <span style=\"font-size:11px;font-weight:700;color:#9aa0ae;\">EMAIL THIS REPORT<\u002Fspan>\n          <input type=\"email\" value=\"{{ rpEmail }}\" sc-camel-on-change=\"{{ onReportEmailChange }}\" placeholder=\"name@company.com\" style=\"flex:1;min-width:220px;max-width:340px;height:40px;box-sizing:border-box;padding:0 12px;border-radius:9px;border:1.4px solid #e3ddd1;font-size:13px;font-family:inherit;background:#fffdf9;\">\n          <button sc-camel-on-click=\"{{ onReportEmail }}\" style=\"padding:9px 16px;border-radius:9px;border:1.4px solid #ddd0fb;background:#f6f1ff;color:#6d28d9;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;\">Send as PDF<\u002Fbutton>\n          <span style=\"font-size:12px;font-weight:600;color:{{ rpEmailNoteColor }};\">{{ rpEmailNote }}<\u002Fspan>\n        <\u002Fdiv>\n\n        <div id=\"report-print-area\" style=\"background:#fff;border:1px solid #ece7dd;border-radius:8px;padding:34px 38px;max-width:860px;\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:14px;padding-bottom:12px;margin-bottom:16px;border-bottom:2px solid #20243f;flex-wrap:wrap;\">\n            <div style=\"display:flex;align-items:center;gap:10px;\">\n              <span style=\"font-size:17px;font-weight:700;color:#7c3aed;letter-spacing:-.02em;\">cosito<\u002Fspan>\n              <span style=\"font-size:13px;font-weight:600;color:#3a3f57;\">{{ rpMovementType }}<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#5b6172;\">{{ rpRecordId }} · {{ rpTimestamp }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"text-align:center;font-size:16px;font-weight:700;letter-spacing:.02em;color:#20243f;margin-bottom:4px;\">{{ rpTitle }}<\u002Fdiv>\n          <div style=\"text-align:center;font-size:12px;font-weight:600;color:#6d28d9;margin-bottom:18px;\">{{ rpRecipientLine }}<\u002Fdiv>\n          <sc-for list=\"{{ rpSections }}\" as=\"ps\" hint-placeholder-count=\"3\">\n            <div data-print-section=\"true\" style=\"margin-bottom:18px;\">\n              <div style=\"font-size:11px;font-weight:700;letter-spacing:.05em;color:#5b6172;background:#eef1f7;border:1px solid #20243f;padding:7px 10px;\">{{ ps.title }}<\u002Fdiv>\n              <sc-for list=\"{{ ps.rows }}\" as=\"pr\" hint-placeholder-count=\"4\">\n                <div style=\"display:grid;grid-template-columns:1fr 1fr;border:1px solid #20243f;border-top:none;\">\n                  <sc-for list=\"{{ pr.cells }}\" as=\"pc\" hint-placeholder-count=\"2\">\n                    <div style=\"display:grid;grid-template-columns:170px 1fr;\">\n                      <div style=\"padding:8px 10px;font-size:12px;font-weight:700;color:#20243f;border-right:1px solid #20243f;\">{{ pc.name }}<\u002Fdiv>\n                      <div style=\"padding:8px 10px;font-size:12px;color:#3a3f57;border-right:{{ pc.rightBorder }};\">{{ pc.value }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"display:flex;justify-content:space-between;gap:20px;margin-top:26px;padding-top:12px;border-top:1px solid #d8d3c8;font-size:11px;color:#8b8f9e;\">\n            <span>Inspector: {{ rpOperator }}<\u002Fspan>\n            <span>Status: {{ rpStatus }} · Disposition: {{ rpDisposition }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ RECORD DETAIL ============ -->\n      <sc-if value=\"{{ viewRecordDetail }}\" hint-placeholder-val=\"{{ false }}\">\n       <div id=\"record-print-area\" style=\"padding-right:{{ rdPadRight }};\">\n        <a href=\"#\" sc-camel-on-click=\"{{ goRecords }}\" data-print-hide=\"true\" style=\"font-size:13.5px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px;margin-bottom:16px;\">← Back to Inspection Records<\u002Fa>\n        <div data-print-card=\"true\" style=\"position:sticky;top:-32px;z-index:5;background:#fff;border-radius:16px;border:1px solid #ece7dd;padding:20px 24px;margin-bottom:18px;display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:14px;box-shadow:0 6px 18px rgba(32,36,63,.06);\">\n          <div>\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#9aa0ae;margin-bottom:4px;\">{{ rdId }} · v{{ rdVersion }}<\u002Fdiv>\n            <div style=\"font-size:20px;font-weight:700;color:#20243f;\">{{ rdTemplateName }}<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#8b8f9e;margin-top:4px;\">{{ rdOperator }} · {{ rdTimestampLabel }} · {{ rdPoCount }} PO · {{ rdSkuCount }} SKU<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap;\">\n            <span style=\"display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:4px 11px;border-radius:20px;background:{{ rdStatusBg }};color:{{ rdStatusColor }};\"><span style=\"opacity:.6;font-weight:600;\">STATUS<\u002Fspan>{{ rdWorkflowStatus }}<\u002Fspan>\n            <span style=\"display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:4px 11px;border-radius:20px;background:{{ rdDispBg }};color:{{ rdDispColor }};\"><span style=\"opacity:.6;font-weight:600;\">DISPOSITION<\u002Fspan>{{ rdDispositionLabel }}<\u002Fspan>\n            <button sc-camel-on-click=\"{{ onPrintRecord }}\" data-print-hide=\"true\" title=\"Save this record as PDF\" style=\"display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;border:1.4px solid #e3ddd1;background:#fff;color:#5b6172;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;\">\n              <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5b6172\" stroke-width=\"1.9\"><path d=\"M6 9V3h12v6\"><\u002Fpath><rect x=\"4\" y=\"9\" width=\"16\" height=\"8\" rx=\"2\"><\u002Frect><path d=\"M7 17h10v4H7z\"><\u002Fpath><\u002Fsvg>\n              Save as PDF\n            <\u002Fbutton>\n            <sc-if value=\"{{ rdShowEditButton }}\" hint-placeholder-val=\"{{ false }}\">\n              <button sc-camel-on-click=\"{{ onEditRecord }}\" data-print-hide=\"true\" style=\"padding:8px 16px;border-radius:9px;border:1.4px solid #e3ddd1;background:#fff;color:#5b6172;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;\">Edit<\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ rdEditing }}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"display:flex;gap:8px;\" data-print-hide=\"true\">\n                <button sc-camel-on-click=\"{{ onCancelRecordEdit }}\" style=\"padding:8px 14px;border-radius:9px;border:1.4px solid #e3ddd1;background:#fff;color:#8b8f9e;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;\">Cancel<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ onSaveRecordEdit }}\" style=\"padding:8px 14px;border-radius:9px;border:1.4px solid #e3ddd1;background:#fff;color:#5b6172;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;\">Save as draft<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ onSubmitRecordEdit }}\" style=\"padding:8px 18px;border-radius:9px;border:none;background:#7c3aed;color:#fff;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;box-shadow:0 6px 16px rgba(124,58,237,.28);\">Submit<\u002Fbutton>\n              <\u002Fspan>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ rdLockedNote }}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"font-size:11.5px;color:#9aa0ae;\">Locked — already dispositioned<\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ rdShowApproval }}\" hint-placeholder-val=\"{{ false }}\">\n          <div data-print-hide=\"true\" style=\"position:{{ rdPanelPos }};top:24px;right:24px;bottom:{{ rdPanelBottom }};width:{{ rdPanelWidth }};overflow-y:auto;z-index:6;margin-bottom:18px;background:#fff;border-radius:16px;border:1.6px solid #e2d6fb;padding:20px 22px;box-shadow:0 18px 40px rgba(32,36,63,.13);box-sizing:border-box;display:flex;flex-direction:column;\">\n            <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:4px;flex-wrap:wrap;\">\n              <span style=\"font-size:15px;font-weight:700;color:#20243f;\">QA disposition<\u002Fspan>\n              <span style=\"font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;background:#f1ecfe;color:#7c3aed;\">ADMIN ONLY<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#8b8f9e;margin-bottom:14px;\">The approval decision on this submitted record. Separate from the inspector's capture.<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:6px;margin-bottom:14px;\">\n              <sc-for list=\"{{ rdDispChoices }}\" as=\"dc\" hint-placeholder-count=\"5\">\n                <span sc-camel-on-click=\"{{ dc.onPick }}\" style=\"font-size:12.5px;font-weight:700;padding:9px 14px;border-radius:10px;cursor:pointer;border:1.6px solid {{ dc.border }};background:{{ dc.bg }};color:{{ dc.color }};\">{{ dc.label }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"font-size:11px;font-weight:700;color:#9aa0ae;margin-bottom:6px;\">DECISION NOTES<\u002Fdiv>\n            <textarea value=\"{{ rdDispNotes }}\" sc-camel-on-change=\"{{ onDispNotesChange }}\" placeholder=\"Why this decision? Conditions, hold reasons, claim references…\" style=\"width:100%;flex:1;min-height:96px;padding:11px 13px;border-radius:10px;border:1.4px solid #e3ddd1;font-size:13px;font-family:inherit;color:#3a3f57;resize:vertical;box-sizing:border-box;\"><\u002Ftextarea>\n            <div style=\"display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-top:12px;\">\n              <button sc-camel-on-click= -on-click=\"{{ onVoiceDone }}\" style=\"cursor:pointer;color:#b3aea1;font-size:15px;\">✕<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"flex:1;overflow-y:auto;padding:16px 22px 20px;\">\n        <div style=\"font-size:10.5px;font-weight:700;letter-spacing:.06em;color:#9aa0ae;margin-bottom:7px;\">TRANSCRIPT<\u002Fdiv>\n        <div style=\"background:#faf8f4;border:1px solid #f0ece3;border-radius:12px;padding:13px 15px;font-size:13px;color:#3a3f57;line-height:1.55;font-style:italic;\">“{{ voiceTranscriptText }}”<\u002Fdiv>\n        <div style=\"font-size:10.5px;font-weight:700;letter-spacing:.06em;color:#9aa0ae;margin:18px 0 7px;\">INSPECTION POINTS UPDATED<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px;\">\n          <sc-for list=\"{{ voiceUpdates }}\" as=\"vu\" hint-placeholder-count=\"2\">\n            <div style=\"border:1.4px solid #e2d6fb;border-radius:12px;padding:11px 13px;display:flex;align-items:center;gap:10px;\">\n              <div style=\"flex:1;min-width:0;\">\n                <div style=\"font-size:13.5px;font-weight:700;color:#20243f;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ vu.name }}<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#9aa0ae;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ vu.path }}<\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:20px;background:#e6f7ec;color:#1f8a4c;white-space:nowrap;\">{{ vu.value }}<\u002Fspan>\n              <span style=\"font-size:11px;color:#b3aea1;\">{{ vu.confidence }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ voiceNoUpdates }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:12.5px;color:#9aa0ae;padding:10px 2px;\">Nothing matched a field in this template. Try naming the field, then the value.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 22px 18px;border-top:1px solid #f4f0e8;\">\n        <button sc-camel-on-click=\"{{ onVoiceClear }}\" style=\"padding:10px 16px;border-radius:10px;border:1.4px solid #e3ddd1;background:#fff;color:#5b6172;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;\">Clear readings<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ onVoiceDone }}\" style=\"padding:10px 24px;border-radius:10px;border:none;background:#7c3aed;color:#fff;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;box-shadow:0 6px 16px rgba(124,58,237,.28);\">Done<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\n\nclass Component extends DCLogic {\n  state = {\n    ready: false,\n    view: \"templates\",\n    templates: [],\n    records: [],\n    selectedTemplateId: null,\n    selectedRecordId: null,\n    showVersionHistory: false,\n    viewingVersion: null,\n    templateDirty: false,\n    fieldPanelOpen: false,\n    uploadStatus: null,\n    newRecordTemplateId: null,\n    draft: null,\n    submitError: \"\",\n    filters: { status: \"All\", disposition: \"All\", operator: \"All\", template: \"All\", dateFrom: \"\", dateTo: \"\" },\n    labelFilters: {},\n    calOpen: false, calMonth: null, calPending: false,\n    openRecordFilter: null,\n    reportTemplateId: null, reportRecordId: null, reportEmail: \"\", reportSavedAt: null, reportEmailNote: \"\",\n    // Report layouts live per TEMPLATE: one named layout per recipient (HEB, Walmart, Whole Foods…).\n    reportLayouts: {}, reportLayoutId: null, layoutPick: {},\n    recordEditMode: false,\n    labelColumns: {},\n    visibleColumns: { poCount: false, skuCount: false },\n    role: \"admin\",\n    winW: typeof window !== \"undefined\" ? window.innerWidth : 1440,\n    approvalDraft: null,\n    dispSaved: false,\n    voicePhase: \"idle\", voiceElapsed: 0, voiceUpdates: [], voiceTranscriptText: \"\",\n    labelSets: [],\n    openLabelDropdown: null,\n    newLabelSetName: \"\",\n    newValueDraft: {},\n    templateLabelFilter: {},\n    extraColumns: [],\n    showColumnPicker: false,\n    columnQuery: \"\",\n    fieldFilters: {},\n    masterGroups: [],\n    mdGroupId: null, mdQuery: \"\", mdWizard: null, mdSaved: \"\", mdEditCols: false,\n  };\n\n  _onResize = () => { const w = window.innerWidth; if ((w < 1180) !== (this.state.winW < 1180)) this.setState({ winW: w }); else this.state.winW = w; };\n  componentWillUnmount() { window.removeEventListener(\"resize\", this._onResize); }\n  componentDidMount() {\n    window.addEventListener(\"resize\", this._onResize);\n    import((window.__resources && (window.__resources[\"./feature-docs.js\"] || window.__resources.featureDocs)) || \"./feature-docs.js\").then((d) => { this._docs = d; this.forceUpdate(); }).catch(() => {});\n    import((window.__resources && (window.__resources[\"./goods-movement-data.js\"] || window.__resources.gmData)) || \"./goods-movement-data.js\").then((mod) => {\n      this._data = mod;\n      const templates = JSON.parse(JSON.stringify(mod.initialTemplates));\n      const seed = { tmpl_pineapple: \"Fresh Produce\", tmpl_mango: \"Fresh Produce\", tmpl_strawberry: \"Perishable\" };\n      templates.forEach((t) => { t.labels = t.labels || {}; if (seed[t.id]) t.labels.ls_prod = seed[t.id]; });\n      this.setState({\n        ready: true,\n        templates,\n        records: JSON.parse(JSON.stringify(mod.initialRecords)),\n        labelSets: JSON.parse(JSON.stringify(mod.initialLabelSets)),\n        masterGroups: JSON.parse(JSON.stringify(mod.initialMasterGroups)),\n        reportLayouts: this.seedLayouts(mod.initialTemplates),\n      });\n    });\n  }\n\n  // ---------- master data ----------\n  goMasterData = () => { if (this.state.role === \"admin\") this.setState({ view: \"masterData\
