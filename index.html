document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

eady }}\" hint-placeholder-val=\"{{ false }}\">\n\n      <!-- ============ TEMPLATES LIST ============ -->\n      <sc-if value=\"{{ viewTemplates }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px;\">\n          <div>\n            <div style=\"font-size:26px;font-weight:700;color:#20243f;\">Goods Movement Templates<\u002Fdiv>\n            <div style=\"font-size:14px;color:#8b8f9e;margin-top:4px;max-width:560px;\">Reusable inspection forms for receiving, shipping and internal transfers — configured once in Excel, then used to generate every Inspection Record.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:flex-end;gap:6px;\">\n            <div style=\"display:flex;gap:9px;align-items:center;\">\n              <a href=\"https://docs.google.com/spreadsheets/d/1KQ6nZUHiohNYqpldJ4dysrzNUq5cOeBY/edit?usp=share_link&amp;ouid=112417528343335107194&amp;rtpof=true&amp;sd=true\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;align-items:center;gap:7px;padding:12px 16px;border-radius:12px;border:1.4px solid #cfe8f7;background:#f0f9ff;color:#0369a1;font-weight:700;font-size:13.5px;text-decoration:none;\">\n                <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0369a1\" stroke-width=\"2\"><path d=\"M12 4v12M7 11l5 5 5-5M4 20h16\"><\u002Fpath><\u002Fsvg>\n                Get Cosito template\n              <\u002Fa>\n              <label style=\"display:flex;align-items:center;gap:8px;padding:12px 18px;border-radius:12px;background:#7c3aed;color:#fff;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 6px 16px rgba(124,58,237,.28);\">\n                <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\"><path d=\"M12 3v13M6 10l6-7 6 7\"><\u002Fpath><path d=\"M4 21h16\"><\u002Fpath><\u002Fsvg>\n                Upload Cosito template (.xlsx)\n                <input type=\"file\" accept=\".xlsx\" sc-camel-on-change=\"{{ onUploadFile }}\" style=\"display:none;\">\n              <\u002Flabel>\n            <\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#8b8f9e;text-align:right;max-width:340px;\">Step 1 — get the template and fill it in. Step 2 — upload it.<\u002Fdiv>\n            <button sc-camel-on-click=\"{{ goLabels }}\" style=\"display:flex;align-items:center;gap:7px;margin-top:2px;padding:10px 15px;border-radius:12px;background:#fff;border:1.4px solid #e3ddd1;color:#5b6172;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;\">\n              <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5b6172\" stroke-width=\"2\"><path d=\"M20.6 13.4 12 22l-9-9V4h9l8.6 8.6a1.4 1.4 0 0 1 0 2z\"><\u002Fpath><circle cx=\"7.5\" cy=\"7.5\" r=\"1.3\"><\u002Fcircle><\u002Fsvg>\n              Manage template labels\n            <\u002Fbutton>\n            <sc-if value=\"{{ hasUploadStatus }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size:12.5px;color:{{ uploadStatusColor }};font-weight:600;\">{{ uploadStatusMessage }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:22px;\">\n          <sc-for list=\"{{ labelFilterGroups }}\" as=\"lg\" hint-placeholder-count=\"2\">\n            <div style=\"display:flex;flex-direction:column;gap:5px;position:relative;\">\n              <span style=\"font-size:10.5px;font-weight:700;color:#9aa0ae;letter-spacing:.04em;\">{{ lg.name }}<\u002Fspan>\n              <div sc-camel-on-click=\"{{ lg.onToggle }}\" style=\"display:flex;align-items:center;gap:10px;min-width:210px;padding:9px 12px;border-radius:10px;border:1.4px solid {{ lg.borderColor }};background:#fff;cursor:pointer;\">\n                <span style=\"flex:1;font-size:13px;font-weight:600;color:{{ lg.summaryColor }};\">{{ lg.summary }}<\u002Fspan>\n                <span style=\"font-size:10px;color:#9aa0ae;\">{{ lg.chevron }}<\u002Fspan>\n              <\u002Fdiv>\n              <sc-if value=\"{{ lg.isOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"position:absolute;top:100%;left:0;margin-top:6px;z-index:60;min-width:250px;max-height:280px;overflow-y:auto;background:#fff;border:1.4px solid #ddd0fb;border-radius:12px;box-shadow:0 12px 30px rgba(32,36,63,.14);padding:7px;display:flex;flex-direction:column;gap:2px;\">\n                  <sc-for list=\"{{ lg.options }}\" as=\"lo\" hint-placeholder-count=\"4\">\n                    <div sc-camel-on-click=\"{{ lo.onClick }}\" style=\"display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:8px;cursor:pointer;\">\n                      <span style=\"width:16px;height:16px;border-radius:5px;border:1.6px solid {{ lo.checkBorder }};background:{{ lo.checkBg }};color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;flex:none;\">{{ lo.checkMark }}<\u002Fspan>\n                      <span style=\"flex:1;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;background:{{ lo.bg }};color:{{ lo.color }};\">{{ lo.value }}<\u002Fspan>\n                      <span style=\"font-size:11.5px;color:#9aa0ae;\">{{ lo.count }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                  <sc-if value=\"{{ lg.hasSelection }}\" hint-placeholder-val=\"{{ false }}\">\n                    <span sc-camel-on-click=\"{{ lg.onClear }}\" style=\"padding:7px 9px;font-size:12px;font-weight:700;color:#7c3aed;cursor:pointer;\">Clear<\u002Fspan>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"display:flex;align-items:center;gap:12px;padding-bottom:10px;\">\n            <span style=\"font-size:12.5px;color:#8b8f9e;\">{{ matchCountLabel }}<\u002Fspan>\n            <span sc-camel-on-click=\"{{ onClearAllLabelFilters }}\" style=\"font-size:12.5px;font-weight:700;color:#9aa0ae;cursor:pointer;\">Reset<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;\">\n          <sc-for list=\"{{ templateCards }}\" as=\"tpl\" hint-placeholder-count=\"3\">\n            <div style=\"background:#fff;border-radius:16px;border:1px solid #ece7dd;padding:18px 20px;display:flex;flex-direction:column;gap:12px;\">\n              <div>\n                <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:10px;\">\n                  <div style=\"font-weight:700;font-size:16px;color:#20243f;\">{{ tpl.name }}<\u002Fdiv>\n                  <span style=\"font-size:11.5px;font-weight:700;color:#9aa0ae;font-family:'JetBrains Mono',monospace;flex:none;\">v{{ tpl.version }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-size:12.5px;color:#9aa0ae;margin-top:2px;\">Updated {{ tpl.updatedLabel }} · {{ tpl.sectionCount }} sections · {{ tpl.fieldCount }} fields<\u002Fdiv>\n                <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;\">\n                  <sc-for list=\"{{ tpl.labelChips }}\" as=\"lc\" hint-placeholder-count=\"1\">\n                    <span style=\"font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;background:{{ lc.bg }};color:{{ lc.color }};\">{{ lc.value }}<\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div sc-camel-on-click=\"{{ tpl.onToggleEnabled }}\" style=\"display:flex;align-items:center;gap:9px;cursor:pointer;width:fit-content;\">\n                <div style=\"width:34px;height:19px;border-radius:20px;background:{{ tpl.switchBg }};position:relative;transition:background .15s;\">\n                  <div style=\"width:15px;height:15px;border-radius:50%;background:#fff;position:absolute;top:2px;left:{{ tpl.switchLeft }};transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.25);\"><\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"font-size:12.5px;font-weight:600;color:{{ tpl.switchLabelColor }};\">{{ tpl.enabledLabel }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:8px;margin-top:2px;\">\n                <button sc-camel-on-click=\"{{ tpl.onOpen }}\" style=\"flex:1;padding:8px 10px;border-radius:9px;border:1.4px solid #ddd0fb;background:#f6f1ff;color:#6d28d9;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;\">View / Edit<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ tpl.onDuplicate }}\" title=\"Duplicate\" style=\"padding:8px 11px;border-radius:9px;border:1.4px solid #e3ddd1;background:#fff;color:#5b6172;cursor:pointer;font-family:inherit;\">\n                  <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5b6172\" stroke-width=\"2\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2\"><\u002Frect><path d=\"M4 16V6a2 2 0 0 1 2-2h10\"><\u002Fpath><\u002Fsvg>\n                <\u002Fbutton>\n                <button sc-camel-on-click=\"{{ tpl.onDelete }}\" title=\"Delete\" style=\"padding:8px 11px;border-radius:9px;border:1.4px solid #f4d6d6;background:#fff;color:#c0392b;cursor:pointer;font-family:inherit;\">\n                  <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#c0392b\" stroke-width=\"2\"><path d=\"M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14\"><\u002Fpath><\u002Fsvg>\n                <\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ MASTER DATA — LIST OF GROUPS ============ -->\n      <sc-if value=\"{{ viewMasterData }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px;\">\n          <div>\n            <div style=\"font-size:26px;font-weight:700;color:#20243f;\">Master Data<\u002Fdiv>\n            <div style=\"font-size:14px;color:#8b8f9e;margin-top:4px;max-width:600px;\">The approved reference lists inspection templates pull from. Seed a list from Excel once, then keep it current by hand.<\u002Fdiv>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ mdStartWizard }}\" style=\"display:flex;align-items:center;gap:8px;padding:12px 18px;border-radius:12px;background:#0369a1;color:#fff;border:none;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;box-shadow:0 6px 16px rgba(3,105,161,.28);\">\n            <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg>\n            Create new list\n          <\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#9aa0ae;font-weight:600;margin-bottom:12px;\">{{ masterCountLabel }}<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;\">\n          <sc-for list=\"{{ masterCards }}\" as=\"mc\" hint-placeholder-count=\"4\">\n            <div sc-camel-on-click=\"{{ mc.onOpen }}\" style=\"background:#fff;border-radius:16px;border:1px solid #ece7dd;padding:20px;cursor:pointer;display:flex;flex-direction:column;gap:12px;\">\n              <div style=\"display:flex;align-items:center;gap:10px;\">\n                <div style=\"width:34px;height:34px;border-radius:10px;background:#e8f4fd;display:flex;align-items:center;justify-content:center;\">\n                  <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0369a1\" stroke-width=\"1.9\"><ellipse cx=\"12\" cy=\"6\" rx=\"7.5\" ry=\"3\"><\u002Fellipse><path d=\"M4.5 6v12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6\"><\u002Fpath><\u002Fsvg>\n                <\u002Fdiv>\n                <div style=\"flex:1;min-width:0;\">\n                  <div style=\"font-size:15.5px;font-weight:700;color:#20243f;\">{{ mc.name }}<\u002Fdiv>\n                  <div style=\"font-size:12px;color:#9aa0ae;\">{{ mc.countLabel }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:6px;\">\n                <sc-for list=\"{{ mc.colChips }}\" as=\"ch\" hint-placeholder-count=\"3\">\n                  <span style=\"font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:#f4f1ea;color:#6b7080;\">{{ ch.name }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#a7adba;\">{{ mc.sourceLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ MASTER DATA — EDITABLE TABLE ============ -->\n      <sc-if value=\"{{ viewMasterDataDetail }}\" hint-placeholder-val=\"{{ false }}\">\n        <a href=\"#\" sc-camel-on-click=\"{{ goMasterData }}\" style=\"font-size:13.5px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px;margin-bottom:16px;\">← Back to Master Data<\u002Fa>\n        <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:18px;\">\n          <div>\n            <input type=\"text\" value=\"{{ mdName }}\" sc-camel-on-change=\"{{ mdRenameGroup }}\" title=\"Rename this list\" style=\"font-size:26px;font-weight:700;color:#20243f;font-family:inherit;border:1.5px solid transparent;border-radius:9px;background:transparent;padding:2px 8px;margin-left:-8px;max-width:520px;width:100%;\" style-hover=\"border-color:#e3ddd1;background:#fff;\" style-focus=\"border-color:#7dd3fc;background:#fff;\">\n            <div style=\"font-size:13px;color:#8b8f9e;margin-top:4px;\">{{ mdSourceLabel }}<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#0369a1;margin-top:6px;font-weight:600;\">{{ mdConsumersLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:9px;align-items:center;\">\n            <input type=\"text\" value=\"{{ mdQuery }}\" sc-camel-on-change=\"{{ onMdQuery }}\" placeholder=\"Search records…\" style=\"height:44px;box-sizing:border-box;padding:0 13px;border-radius:12px;border:1.4px solid #e3ddd1;font-size:13.5px;font-family:inherit;background:#fff;min-width:200px;\">\n            <button sc-camel-on-click=\"{{ mdAddRow }}\" style=\"display:flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;background:#0369a1;color:#fff;border:none;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;\">\n              <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg>\n              Add record\n            <\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:12px;\">\n          <span style=\"font-size:12.5px;color:#9aa0ae;font-weight:600;\">{{ mdCountLabel }}<\u002Fspan>\n          <span sc-camel-on-click=\"{{ mdToggleColumnEditor }}\" style=\"cursor:pointer;font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:20px;border:1.3px solid #cfe8f7;background:#f0f9ff;color:#0369a1;\">{{ mdColsEditorLabel }}<\u002Fspan>\n          <sc-if value=\"{{ mdHasSaved }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;background:#e6f7ec;color:#1f8a4c;\">{{ mdSaved }}<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <sc-if value=\"{{ mdEditCols }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#f0f9ff;border:1.4px solid #cfe8f7;border-radius:14px;padding:16px 18px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px;\">\n            <span style=\"font-size:10.5px;font-weight:700;letter-spacing:.06em;color:#0369a1;\">COLUMNS OF THIS LIST<\u002Fspan>\n            <sc-for list=\"{{ mdEditableColumns }}\" as=\"ec\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;gap:8px;align-items:center;\">\n                <input type=\"text\" value=\"{{ ec.name }}\" sc-camel-on-change=\"{{ ec.onRename }}\" style=\"flex:1;height:40px;box-sizing:border-box;padding:0 11px;border-radius:9px;border:1.4px solid #cfe8f7;font-size:13.5px;font-family:inherit;background:#fff;\">\n                <span sc-camel-on-click=\"{{ ec.onUp }}\" title=\"Move left\" style=\"cursor:pointer;width:26px;text-align:center;color:#0369a1;font-size:13px;\">↑<\u002Fspan>\n                <span sc-camel-on-click=\"{{ ec.onDown }}\" title=\"Move right\" style=\"cursor:pointer;width:26px;text-align:center;color:#0369a1;font-size:13px;\">↓<\u002Fspan>\n                <span sc-camel-on-click=\"{{ ec.onRemove }}\" title=\"Remove column\" style=\"cursor:pointer;width:26px;text-align:center;color:#c0392b;font-size:13px;\">✕<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;\">\n              <span sc-camel-on-click=\"{{ mdAddGroupColumn }}\" style=\"cursor:pointer;padding:8px 13px;border-radius:9px;border:1.4px dashed #7dd3fc;color:#0369a1;font-size:12px;font-weight:700;\">+ Add column<\u002Fspan>\n              <span style=\"font-size:11.5px;color:#0c4a6e;\">Removing a column deletes its values from every record in this list.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"background:#fff;border-radius:16px;border:1px solid #ece7dd;overflow:hidden;\">\n          <div style=\"display:flex;gap:0;padding:11px 16px;background:#faf8f4;border-bottom:1px solid #ece7dd;\">\n            <sc-for list=\"{{ mdColumns }}\" as=\"col\" hint-placeholder-count=\"4\">\n              <span style=\"flex:1;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:#8b8f9e;\">{{ col.name }}<\u002Fspan>\n            <\u002Fsc-for>\n            <span style=\"width:34px;flex:none;\"><\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ mdRows }}\" as=\"row\" hint-placeholder-count=\"6\">\n            <div style=\"display:flex;gap:10px;padding:8px 16px;border-bottom:1px solid #f5f1e9;align-items:center;\">\n              <sc-for list=\"{{ row.cells }}\" as=\"cell\" hint-placeholder-count=\"4\">\n                <input type=\"text\" value=\"{{ cell.value }}\" sc-camel-on-change=\"{{ cell.onChange }}\" placeholder=\"{{ cell.placeholder }}\" style=\"flex:1;min-width:0;height:38px;box-sizing:border-box;padding:0 10px;border-radius:8px;border:1.3px solid transparent;font-size:13px;font-family:inherit;background:#fdfcf9;color:#2c2f45;\" style-focus=\"border-color:#7dd3fc;background:#fff;\">\n              <\u002Fsc-for>\n              <span sc-camel-on-click=\"{{ row.onDelete }}\" title=\"Delete record\" style=\"width:34px;flex:none;text-align:center;cursor:pointer;color:#c0392b;font-size:13px;\">✕<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ mdNoRows }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:34px 16px;text-align:center;font-size:13.5px;color:#a7adba;\">No records yet — use “Add record”.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap;\">\n          <span style=\"font-size:12px;color:#a7adba;max-width:520px;\">Each cell saves on its own as you type. Missing a couple of records after the initial Excel load? Add them here rather than re-importing the file.<\u002Fspan>\n          <span sc-camel-on-click=\"{{ mdDeleteGroup }}\" style=\"cursor:pointer;color:#c0392b;font-weight:700;font-size:12.5px;\">Delete this list<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ CREATE NEW LIST (full page) ============ -->\n      <sc-if value=\"{{ viewMasterDataNew }}\" hint-placeholder-val=\"{{ false }}\">\n        <a href=\"#\" sc-camel-on-click=\"{{ mdCancelWizard }}\" style=\"font-size:13.5px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px;margin-bottom:16px;\">← Back to Master Data<\u002Fa>\n        <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:20px;\">\n          <div style=\"flex:1;min-width:280px;\">\n            <input type=\"text\" value=\"{{ mdWizName }}\" sc-camel-on-change=\"{{ onMdWizName }}\" placeholder=\"Name this list — e.g. Customers, Vendors, Growers\" style=\"font-size:26px;font-weight:700;color:#20243f;font-family:inherit;border:1.5px solid transparent;border-radius:9px;background:transparent;padding:2px 8px;margin-left:-8px;width:100%;max-width:560px;box-sizing:border-box;\" style-hover=\"border-color:#e3ddd1;background:#fff;\" style-focus=\"border-color:#7dd3fc;background:#fff;\">\n            <div style=\"font-size:13px;color:#8b8f9e;margin-top:6px;\">{{ mdWizSourceLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:9px;align-items:center;\">\n            <label style=\"display:flex;align-items:center;gap:8px;height:44px;box-sizing:border-box;padding:0 17px;border-radius:12px;border:1.5px solid #cfe8f7;background:#f0f9ff;color:#0369a1;font-weight:700;font-size:13.5px;cursor:pointer;\">\n              <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0369a1\" stroke-width=\"2\"><path d=\"M12 16V4M7 9l5-5 5 5M4 17v2a1 1 0 001 1h14a1 1 0 001-1v-2\"><\u002Fpath><\u002Fsvg>\n              Upload Excel\n              <input type=\"file\" accept=\".xlsx,.csv\" sc-camel-on-change=\"{{ onMdExcel }}\" style=\"display:none;\">\n            <\u002Flabel>\n            <span sc-camel-on-click=\"{{ mdCancelWizard }}\" style=\"display:flex;align-items:center;height:44px;box-sizing:border-box;padding:0 17px;border-radius:12px;border:1.4px solid #e3ddd1;color:#5b6172;font-weight:700;font-size:13.5px;cursor:pointer;background:#fff;\">Cancel<\u002Fspan>\n            <button sc-camel-on-click=\"{{ mdSaveNewList }}\" style=\"height:44px;padding:0 20px;border-radius:12px;border:none;background:#0369a1;color:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;box-shadow:0 6px 16px rgba(3,105,161,.28);\">Save list<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ mdWizHasError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:11px 14px;border-radius:11px;background:#fde8e8;color:#c0392b;font-size:12.5px;font-weight:600;margin-bottom:14px;\">{{ mdWizError }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ mdWizBusy }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:11px 14px;border-radius:11px;background:#f0f9ff;color:#0369a1;font-size:12.5px;font-weight:600;margin-bottom:14px;\">Reading {{ mdWizFileName }}…<\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"background:#f0f9ff;border:1.4px solid #cfe8f7;border-radius:14px;padding:16px 18px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px;\">\n          <span style=\"font-size:10.5px;font-weight:700;letter-spacing:.06em;color:#0369a1;\">COLUMNS<\u002Fspan>\n          <sc-for list=\"{{ mdWizColumns }}\" as=\"wc\" hint-placeholder-count=\"2\">\n            <div style=\"display:flex;gap:8px;align-items:center;\">\n              <input type=\"text\" value=\"{{ wc.name }}\" sc-camel-on-change=\"{{ wc.onRename }}\" style=\"flex:1;height:40px;box-sizing:border-box;padding:0 11px;border-radius:9px;border:1.4px solid #cfe8f7;font-size:13.5px;font-family:inherit;background:#fff;\">\n              <span sc-camel-on-click=\"{{ wc.onUp }}\" title=\"Move left\" style=\"cursor:pointer;width:26px;text-align:center;color:#0369a1;font-size:13px;\">↑<\u002Fspan>\n              <span sc-camel-on-click=\"{{ wc.onDown }}\" title=\"Move right\" style=\"cursor:pointer;width:26px;text-align:center;color:#0369a1;font-size:13px;\">↓<\u002Fspan>\n              <span sc-camel-on-click=\"{{ wc.onRemove }}\" title=\"Remove column\" style=\"cursor:pointer;width:26px;text-align:center;color:#c0392b;font-size:13px;\">✕<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <span sc-camel-on-click=\"{{ mdAddColumn }}\" style=\"align-self:flex-start;cursor:pointer;padding:8px 13px;border-radius:9px;border:1.4px dashed #7dd3fc;color:#0369a1;font-size:12px;font-weight:700;\">+ Add column<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:12px;\">\n          <span style=\"font-size:12.5px;color:#9aa0ae;font-weight:600;\">{{ mdWizCountLabel }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border-radius:16px;border:1px solid #ece7dd;overflow:hidden;\">\n          <div style=\"display:flex;gap:0;padding:11px 16px;background:#faf8f4;border-bottom:1px solid #ece7dd;\">\n            <sc-for list=\"{{ mdWizColumns }}\" as=\"hc\" hint-placeholder-count=\"2\">\n              <span style=\"flex:1;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:#8b8f9e;\">{{ hc.name }}<\u002Fspan>\n            <\u002Fsc-for>\n            <span style=\"width:34px;flex:none;\"><\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ mdWizRows }}\" as=\"wr\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;gap:10px;padding:8px 16px;border-bottom:1px solid #f5f1e9;align-items:center;\">\n              <sc-for list=\"{{ wr.cells }}\" as=\"wcell\" hint-placeholder-count=\"2\">\n                <input type=\"text\" value=\"{{ wcell.value }}\" sc-camel-on-change=\"{{ wcell.onChange }}\" placeholder=\"{{ wcell.placeholder }}\" style=\"flex:1;min-width:0;height:38px;box-sizing:border-box;padding:0 10px;border-radius:8px;border:1.3px solid transparent;font-size:13px;font-family:inherit;background:#fdfcf9;color:#2c2f45;\" style-focus=\"border-color:#7dd3fc;background:#fff;\">\n              <\u002Fsc-for>\n              <span sc-camel-on-click=\"{{ wr.onDelete }}\" title=\"Remove row\" style=\"width:34px;flex:none;text-align:center;cursor:pointer;color:#c0392b;font-size:13px;\">✕<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap;\">\n          <span sc-camel-on-click=\"{{ mdWizAddRow }}\" style=\"cursor:pointer;padding:9px 14px;border-radius:10px;border:1.4px dashed #d8d3c8;color:#8b8f9e;font-size:12.5px;font-weight:700;\">+ Add row<\u002Fspan>\n          <span style=\"font-size:12px;color:#a7adba;max-width:520px;\">Nothing is stored until you hit Save list. Empty rows are dropped.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ MANAGE TEMPLATE LABELS ============ -->\n      <sc-if value=\"{{ viewLabels }}\" hint-placeholder-val=\"{{ false }}\">\n        <a href=\"#\" sc-camel-on-click=\"{{ goTemplates }}\" style=\"font-size:13.5px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px;margin-bottom:16px;\">← Back to Templates<\u002Fa>\n        <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px;\">\n          <div>\n            <div style=\"font-size:26px;font-weight:700;color:#20243f;\">Manage template labels<\u002Fdiv>\n            <div style=\"font-size:14px;color:#8b8f9e;margin-top:4px;max-width:620px;\">Labels are how you group and find templates. Goods Movement Type comes out of the box; add your own — product category, plant, customer, anything you filter by.<\u002Fdiv>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ onAddLabelSet }}\" style=\"display:flex;align-items:center;gap:8px;padding:12px 18px;border-radius:12px;background:#7c3aed;color:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;border:none;box-shadow:0 6px 16px rgba(124,58,237,.28);\">\n            <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg>\n            Add a new label\n          <\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px;max-width:920px;\">\n          <sc-for list=\"{{ labelSetCards }}\" as=\"ls\" hint-placeholder-count=\"2\">\n            <div draggable=\"{{ true }}\" sc-camel-on-drag-start=\"{{ ls.onDragStart }}\" sc-camel-on-drag-over=\"{{ ls.onDragOver }}\" sc-camel-on-drop=\"{{ ls.onDrop }}\" style=\"background:#fff;border:1px solid #ece7dd;border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:14px;\">\n              <div style=\"display:flex;align-items:center;gap:10px;\">\n                <span title=\"Drag to reorder\" style=\"cursor:grab;color:#c7c2b5;font-size:15px;letter-spacing:-1px;\">⠿<\u002Fspan>\n                <input type=\"text\" value=\"{{ ls.name }}\" sc-camel-on-change=\"{{ ls.onRename }}\" style=\"font-weight:700;font-size:14.5px;color:#20243f;border:1.4px solid #efe9dd;background:#fff;padding:8px 11px;border-radius:8px;font-family:inherit;min-width:260px;\">\n                <sc-if value=\"{{ ls.isBuiltIn }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span style=\"font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;background:#f1ecfe;color:#7c3aed;\">BUILT-IN<\u002Fspan>\n                <\u002Fsc-if>\n                <span style=\"flex:1;\"><\u002Fspan>\n                <sc-if value=\"{{ ls.isCustom }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span sc-camel-on-click=\"{{ ls.onDelete }}\" title=\"Delete label\" style=\"font-size:11.5px;font-weight:700;color:#c0392b;cursor:pointer;padding:6px 11px;border-radius:8px;border:1.2px solid #f4d6d6;\">Delete label<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:7px;align-items:center;\">\n                <sc-for list=\"{{ ls.values }}\" as=\"lv\" hint-placeholder-count=\"4\">\n                  <span draggable=\"{{ true }}\" sc-camel-on-drag-start=\"{{ lv.onDragStart }}\" sc-camel-on-drag-over=\"{{ lv.onDragOver }}\" sc-camel-on-drop=\"{{ lv.onDrop }}\" title=\"Drag to reorder\" style=\"display:inline-flex;align-items:center;gap:6px;background:{{ lv.bg }};border-radius:20px;padding:4px 6px 4px 12px;cursor:grab;\">\n                    <input type=\"text\" value=\"{{ lv.value }}\" sc-camel-on-change=\"{{ lv.onRename }}\" style=\"border:none;background:transparent;color:{{ lv.color }};font-weight:700;font-size:12px;font-family:inherit;width:{{ lv.inputWidth }};outline:none;\">\n                    <span style=\"font-size:10px;color:{{ lv.color }};opacity:.65;\">{{ lv.usedLabel }}<\u002Fspan>\n                    <span sc-camel-on-click=\"{{ lv.onRemove }}\" title=\"Remove option\" style=\"cursor:pointer;color:{{ lv.color }};font-size:12px;width:16px;height:16px;display:flex;align-items:center;justify-content:center;border-radius:50%;opacity:.7;\">✕<\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fsc-for>\n                <span style=\"display:inline-flex;align-items:center;gap:6px;\">\n                  <input type=\"text\" value=\"{{ ls.newValue }}\" sc-camel-on-change=\"{{ ls.onNewValue }}\" sc-camel-on-key-down=\"{{ ls.onNewValueKey }}\" placeholder=\"New option…\" style=\"border:1.3px dashed #c4b5fd;border-radius:20px;padding:6px 13px;font-size:12px;font-family:inherit;background:#fbf9ff;color:#6d28d9;width:140px;\">\n                  <span sc-camel-on-click=\"{{ ls.onAddValue }}\" style=\"cursor:pointer;font-size:12px;font-weight:700;color:#6d28d9;\">Add<\u002Fspan>\n                <\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ TEMPLATE DETAIL ============ -->\n      <sc-if value=\"{{ viewTemplateDetail }}\" hint-placeholder-val=\"{{ false }}\">\n        <a href=\"#\" sc-camel-on-click=\"{{ goTemplates }}\" style=\"font-size:13.5px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px;margin-bottom:16px;\">← Back to Templates<\u002Fa>\n        <div style=\"background:#fff;border-radius:16px;border:1px solid #ece7dd;padding:22px 24px;margin-bottom:20px;\">\n          <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;\">\n            <div>\n              <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:6px;\">\n                <span style=\"font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:20px;background:{{ detailTypeBg }};color:{{ detailTypeColor }};\">{{ detailMovementType }}<\u002Fspan>\n                <span style=\"font-size:11.5px;font-weight:700;color:#9aa0ae;font-family:'JetBrains Mono',monospace;\">v{{ detailVersion }}<\u002Fspan>\n                <sc-if value=\"{{ isHistoricalView }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span style=\"font-size:10px;font-weight:700;padding:2px 9px;border-radius:20px;background:#fff6e0;color:#a5720a;\">VIEWING PAST VERSION — READ ONLY<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <sc-if value=\"{{ canRenameTemplate }}\" hint-placeholder-val=\"{{ false }}\">\n                <input type=\"text\" value=\"{{ detailName }}\" sc-camel-on-change=\"{{ onRenameTemplate }}\" style=\"font-size:22px;font-weight:700;color:#20243f;border:1.4px solid #e3ddd1;background:#fffdf9;padding:3px 6px;margin-left:-6px;border-radius:7px;font-family:inherit;width:100%;max-width:420px;\">\n              <\u002Fsc-if>\n              <sc-if value=\"{{ cannotRenameTemplate }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"font-size:22px;font-weight:700;color:#20243f;padding:3px 0;\">{{ detailName }}<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ isHistoricalView }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"margin-top:6px;font-size:12.5px;color:#5b6172;\">You're viewing a past version. It can't be edited, duplicated or deleted. <span sc-camel-on-click=\"{{ onReturnToLatest }}\" style=\"color:#7c3aed;font-weight:700;cursor:pointer;\">Return to latest<\u002Fspan><\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ noSnapshot }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"margin-top:4px;font-size:11.5px;color:#a5720a;\">No detailed snapshot was recorded for this version — showing current content for reference.<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ detailLabelsEditable }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;\">\n                  <sc-for list=\"{{ detailLabelSets }}\" as=\"dl\" hint-placeholder-count=\"2\">\n                    <div style=\"display:flex;flex-direction:column;gap:4px;\">\n                      <span style=\"font-size:10.5px;font-weight:700;color:#9aa0ae;letter-spacing:.04em;\">{{ dl.name }}<\u002Fspan>\n                      <sc-raw-select value=\"{{ dl.current }}\" sc-camel-on-change=\"{{ dl.onChange }}\" style=\"padding:7px 10px;border-radius:8px;border:1.4px solid #e3ddd1;font-size:12.5px;font-family:inherit;min-width:170px;background:#fff;\">\n                        <option value=\"\">— none —<\u002Foption>\n                        <sc-for list=\"{{ dl.options }}\" as=\"dlo\" hint-placeholder-count=\"3\"><option value=\"{{ dlo }}\">{{ dlo }}<\u002Foption><\u002Fsc-for>\n                      <\u002Fsc-raw-select>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <div sc-camel-on-click=\"{{ toggleVersionHistory }}\" style=\"font-size:12.5px;color:#7c3aed;font-weight:600;cursor:pointer;margin-top:10px;\">{{ versionHistoryLabel }}<\u002Fdiv>\n              <sc-if value=\"{{ showVersionHistory }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"margin-top:8px;display:flex;flex-direction:column;gap:2px;\">\n                  <sc-for list=\"{{ versionRows }}\" as=\"vr\" hint-placeholder-count=\"2\">\n                    <div sc-camel-on-click=\"{{ vr.onSelect }}\" style=\"font-size:12px;color:#8b8f9e;cursor:pointer;padding:5px 8px;border-radius:6px;background:{{ vr.rowBg }};\">v{{ vr.version }} — {{ vr.dateLabel }} — {{ vr.note }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;align-items:flex-end;gap:10px;\">\n              <div sc-camel-on-click=\"{{ onToggleEnabledDetail }}\" style=\"display:flex;align-items:center;gap:9px;cursor:pointer;opacity:{{ enabledToggleOpacity }};\">\n                <div style=\"width:34px;height:19px;border-radius:20px;background:{{ detailSwitchBg }};position:relative;\">\n                  <div style=\"width:15px;height:15px;border-radius:50%;background:#fff;position:absolute;top:2px;left:{{ detailSwitchLeft }};box-shadow:0 1px 3px rgba(0,0,0,.25);\"><\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"font-size:12.5px;font-weight:600;color:{{ detailSwitchLabelColor }};\">{{ detailEnabledLabel }}<\u002Fspan>\n              <\u002Fdiv>\n              <sc-if value=\"{{ showTemplateActions }}\" hint-placeholder-val=\"{{ true }}\">\n
